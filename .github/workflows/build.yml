name: Build Nami APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Nami Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Platform Files
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.piyush.nami --project-name nami .
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Inject Audio & Storage Permissions into AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "READ_MEDIA_AUDIO" "$MANIFEST"; then
            sed -i '/<application/i \
            <uses-permission android:name="android.permission.INTERNET"/>\n\
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n\
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n\
            <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n\
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n\
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\n\
            <uses-permission android:name="android.permission.WAKE_LOCK"/>' "$MANIFEST"
          fi

      - name: Upgrade compileSdk 36 in App & Pub-Cache Plugins
        run: |
          # 1. Update app-level build.gradle.kts
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/g' android/app/build.gradle.kts
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts
          fi

          # 2. Directly patch any plugin in pub-cache (like on_audio_query) hardcoded to SDK 30-34
          find "$HOME/.pub-cache" -name "build.gradle*" -exec sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/g' {} +
          find "$HOME/.pub-cache" -name "build.gradle*" -exec sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/g' {} +

      - name: Build Universal Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nami-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish Automatic GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Nami Build #${{ github.run_number }}"
          files: build/app/outputs/flutter-apk/app-release.apk
          prerelease: false
