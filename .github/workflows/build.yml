name: Build Nami APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Nami Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Platform Files
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.piyush.nami --project-name nami .
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Inject Audio & Storage Permissions into AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "READ_MEDIA_AUDIO" "$MANIFEST"; then
            sed -i '/<application/i \
            <uses-permission android:name="android.permission.INTERNET"/>\n\
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n\
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n\
            <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n\
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n\
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\n\
            <uses-permission android:name="android.permission.WAKE_LOCK"/>' "$MANIFEST"
          fi

      - name: Force compileSdk 36 Across App & All Plugins
        run: |
          # 1. Force compileSdk = 36 and minSdk = 24 in app/build.gradle.kts
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/targetSdk = .*/targetSdk = 35/g' android/app/build.gradle.kts
            sed -i 's/minSdk = .*/minSdk = 24/g' android/app/build.gradle.kts
          fi

          # 2. Rewrite android/build.gradle.kts so plugins.withId runs BEFORE evaluationDependsOn(":app")
          cat << 'KTS_EOF' > android/build.gradle.kts
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          val newBuildDir: Directory = rootProject.layout.buildDirectory.dir("../../build").get()
          rootProject.layout.buildDirectory.value(newBuildDir)

          subprojects {
              val newSubprojectBuildDir: Directory = newBuildDir.dir(project.name)
              project.layout.buildDirectory.value(newSubprojectBuildDir)

              // Force compileSdk 36 as soon as the Android plugin is applied (no afterEvaluate needed!)
              plugins.withId("com.android.library") {
                  extensions.configure<com.android.build.gradle.LibraryExtension>("android") {
                      compileSdk = 36
                      defaultConfig {
                          minSdk = 24
                      }
                  }
              }
          }

          subprojects {
              project.evaluationDependsOn(":app")
          }

          tasks.register<Delete>("clean") {
              delete(rootProject.layout.buildDirectory)
          }
          KTS_EOF

          # 3. Also replace any whole-line compileSdk / compileSdkVersion inside pub-cache plugins (including just_audio's ?: 34)
          CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          find "$CACHE_DIR" -name "build.gradle*" -type f -exec sed -i -E \
            -e 's/^[[:space:]]*compileSdkVersion[[:space:]].*/        compileSdkVersion 36/g' \
            -e 's/^[[:space:]]*compileSdk[[:space:]]*=.*/        compileSdk = 36/g' {} +

      - name: Build Universal Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nami-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish Automatic GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Nami Build #${{ github.run_number }}"
          files: build/app/outputs/flutter-apk/app-release.apk
          prerelease: false
