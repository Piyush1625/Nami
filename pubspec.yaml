name: nami
description: Nami Music Player with Namida UI and Mornye Extension Engine.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Audio & Bit-Perfect Playback Engine
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  audio_session: ^0.1.21
  on_audio_query_forked: ^2.9.0
  # State, Permissions & Storage
  provider: ^6.1.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  # Mornye Extension (.sflx) & Network Handling
  http: ^1.2.2
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
