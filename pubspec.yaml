name: nami
description: Nami Music Player with Namida UI and Mornye Extension Engine.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.12
  audio_session: ^0.1.21
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  http: ^1.2.2
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
