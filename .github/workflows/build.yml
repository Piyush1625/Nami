name: Build Nami APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Nami Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Platform Files
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.piyush.nami --project-name nami .
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Inject Audio & Storage Permissions into AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "READ_MEDIA_AUDIO" "$MANIFEST"; then
            sed -i '/<application/i \
            <uses-permission android:name="android.permission.INTERNET"/>\n\
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n\
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n\
            <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n\
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n\
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\n\
            <uses-permission android:name="android.permission.WAKE_LOCK"/>' "$MANIFEST"
          fi

      - name: Force compileSdk 36 in App & All Plugins (just_audio / audio_session / on_audio_query)
        run: |
          # 1. Force compileSdk = 36 and minSdk = 24 in app/build.gradle.kts
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/targetSdk = .*/targetSdk = 35/g' android/app/build.gradle.kts
            sed -i 's/minSdk = .*/minSdk = 24/g' android/app/build.gradle.kts
          fi

          # 2. Patch all plugin build.gradle files inside PUB_CACHE (both hardcoded numbers and flutter.compileSdkVersion)
          CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          echo "Patching plugins in: $CACHE_DIR"
          find "$CACHE_DIR" -name "build.gradle*" -type f -exec sed -i -E \
            -e 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/g' \
            -e 's/compileSdkVersion[[:space:]]+flutter\.compileSdkVersion/compileSdkVersion 36/g' \
            -e 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/g' \
            -e 's/compileSdk[[:space:]]*=[[:space:]]*flutter\.compileSdkVersion/compileSdk = 36/g' {} +

          # 3. Also set flutter.compileSdkVersion=36 in local.properties so any plugin reading Flutter's default gets 36
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          echo "flutter.targetSdkVersion=35" >> android/local.properties
          echo "flutter.minSdkVersion=24" >> android/local.properties

      - name: Build Universal Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nami-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish Automatic GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Nami Build #${{ github.run_number }}"
          files: build/app/outputs/flutter-apk/app-release.apk
          prerelease: false
